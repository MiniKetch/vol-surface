name: CI

# Build the C++ kernel and run the test suite on every push and PR,
# across the three major platforms. Wheels are *not* built here —
# wire `cibuildwheel` in a separate workflow once you tag a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-tests:
    name: C++ tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  python-package:
    name: Python wheel on ${{ matrix.os }} (Py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build prerequisites
        run: python -m pip install --upgrade pip pybind11 scikit-build-core numpy pytest

      - name: Build & install
        run: pip install -v .

      - name: Smoke test the bindings
        run: |
          python -c "
          import numpy as np
          from vol_surface import OptionType, bs_price, implied_vol, implied_vol_batch
          p = bs_price(OptionType.Call, S=100, K=100, T=1, r=0.05, q=0, sigma=0.20)
          assert abs(p - 10.45058357) < 1e-7, p
          iv = implied_vol(OptionType.Call, market_price=p, S=100, K=100, T=1, r=0.05, q=0)
          assert abs(iv - 0.20) < 1e-6, iv
          n = 1000
          ivs = implied_vol_batch(
              np.zeros(n, dtype=np.int8),
              np.full(n, p), np.full(n, 100.0), np.full(n, 100.0),
              np.full(n, 1.0), np.full(n, 0.05), np.zeros(n),
          )
          assert np.allclose(ivs, 0.20, atol=1e-6), ivs.std()
          print('OK')
          "
